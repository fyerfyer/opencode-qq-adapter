# Optional second account for live E2E tests.
#
# Do not keep this running 24/7: two bot accounts on the same public IP
# increase QQ risk-control exposure.
#
# Use it standalone:
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml stop
#
# Or together with the production NapCat:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d

services:
  napcat-peer:
    image: mlikiowa/napcat-docker@sha256:2cc70b45244ae3fabc657ffc3aaa4de8fb893518171e519659ab83d80e6d36b5
    container_name: opencode-qq-napcat-peer
    restart: "no"
    ports:
      - "${NAPCAT_PEER_HTTP_PORT:-13100}:3000"
      - "${NAPCAT_PEER_WS_PORT:-13101}:3001"
      - "${NAPCAT_PEER_WEBUI_PORT:-16199}:6099"
    volumes:
      - ./data/napcat-peer/config:/app/napcat/config
      - ./data/napcat-peer/qq:/app/.config/QQ
      - ./data/napcat-peer/plugins:/app/napcat/plugins
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      # Optional quick-login account. Leave empty to show the QR code.
      - ACCOUNT=${NAPCAT_PEER_ACCOUNT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
