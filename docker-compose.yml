name: opencode-qq

services:
  napcat:
    # Pinned on purpose. `latest` can change the bundled QQ/NapCat versions and
    # trigger new login-risk-control behaviour without warning. Update the
    # digest deliberately after testing a new image.
    image: mlikiowa/napcat-docker@sha256:2cc70b45244ae3fabc657ffc3aaa4de8fb893518171e519659ab83d80e6d36b5
    container_name: opencode-qq-napcat
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${NAPCAT_WEBUI_PORT:-6099}:6099"
      - "${NAPCAT_WS_PORT:-3001}:3001"
    volumes:
      # Persist the QQ login session; deleting this directory forces a QR scan.
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/qq:/app/.config/QQ
      - ./data/napcat/plugins:/app/napcat/plugins
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional second account for live E2E tests. Do not keep this running 24/7:
  # two bot accounts on the same public IP increase QQ risk-control exposure.
  # Start it only when needed:
  #   docker compose --profile e2e up -d napcat-peer
  napcat-peer:
    profiles: ["e2e"]
    image: mlikiowa/napcat-docker@sha256:2cc70b45244ae3fabc657ffc3aaa4de8fb893518171e519659ab83d80e6d36b5
    container_name: opencode-qq-napcat-peer
    restart: "no"
    ports:
      - "${NAPCAT_PEER_HTTP_PORT:-13100}:3000"
      - "${NAPCAT_PEER_WS_PORT:-13101}:3001"
      - "${NAPCAT_PEER_WEBUI_PORT:-16199}:6099"
    volumes:
      - ./data/napcat-peer/config:/app/napcat/config
      - ./data/napcat-peer/qq:/app/.config/QQ
      - ./data/napcat-peer/plugins:/app/napcat/plugins
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
    extra_hosts:
      - "host.docker.internal:host-gateway"
