version: 1

server:
  host: 127.0.0.1
  port: 8787
  health_path: /health
  # Used by the OpenCode plugin callback endpoints (M4). Leave empty to disable.
  internal_token: ${QQ_BRIDGE_INTERNAL_TOKEN:-}

onebot:
  # NapCat's forward WebSocket server. The bridge connects out to NapCat.
  # For docker-compose.yml this is ws://127.0.0.1:3001.
  url: ${NAPCAT_WS_URL:-ws://127.0.0.1:3001}
  access_token: ${NAPCAT_ACCESS_TOKEN:-}
  # Optional; learned from events / get_login_info when omitted.
  # self_id: 123456789
  action_timeout_ms: 15000
  upload_timeout_ms: 600000
  dedupe_ttl_ms: 600000
  reconnect:
    enabled: true
    attempts: 1000000
    delay_ms: 3000

opencode:
  service:
    # external: discover/attach to `opencode serve --service`
    # ensure:   start it when missing (not a supervisor)
    # off:      only use base_url
    mode: external
    base_url: null
    version: ">=2.0.0 <3.0.0"
    command: ["opencode", "serve", "--service"]
    manage_lifecycle: false
  default_agent: null
  default_model: null
  prompt_timeout_ms: 1800000
  permission_timeout_ms: 120000
  event_reconnect_ms: 2000
  event_reconnect_max_ms: 30000
  health_cache_ms: 5000

security:
  default_effect: deny
  allowed_roots:
    - ..
  require_mention_in_group: true
  max_prompt_chars: 8000
  max_images_per_message: 4
  max_image_bytes: 10485760
  max_queued_prompts: 3
  rate_limit:
    prompts_per_minute: 6
    runs_per_hour: 30
  budgets:
    daily_cost_usd_per_user: 5
    daily_tokens_per_user: 2000000
    daily_cost_usd_per_project: 20

# The project selected when a user has several available projects.
default_project: demo

users:
  "10001":
    role: owner
    projects: ["*"]
  # "10002":
  #   role: member
  #   projects: ["demo"]

groups:
  # "20001":
  #   enabled: true
  #   mode: per_user
  #   require_mention: true
  #   allowed_users: ["10001"]
  #   projects: ["demo"]

projects:
  demo:
    # Relative paths are resolved against this config file's directory.
    path: ..
    description: OpenCode QQ Adapter demo project
    policy: standard
    workspace: shared
    agent: null
    model: null
    allowed_users: ["10001"]
    setup: []
  # blog:
  #   path: /home/me/code/blog
  #   description: Personal blog
  #   policy: standard
  #   workspace: shared
  #   allowed_users: ["10001"]

policies:
  readonly:
    read: allow
    glob: allow
    grep: allow
    edit: deny
    shell: deny
    webfetch: ask
    websearch: ask
    external_directory: deny
  standard:
    read: allow
    glob: allow
    grep: allow
    edit: ask
    shell: ask
    webfetch: ask
    websearch: ask
    external_directory: deny
    shell_rules:
      - pattern: "git status *"
        effect: allow
      - pattern: "git diff *"
        effect: allow
      - pattern: "rm -rf *"
        effect: deny
  trusted:
    read: allow
    glob: allow
    grep: allow
    edit: allow
    shell: allow
    webfetch: allow
    websearch: allow
    external_directory: deny
    shell_rules:
      - pattern: "sudo *"
        effect: deny

workspaces:
  default_mode: shared
  root: var/workspaces
  idle_ttl_hours: 72
  max_per_project: 5
  cleanup:
    require_clean: true
    keep_dirty_days: 7

logging:
  level: info
  audit_retention_days: 90
  store_prompt_content: false
  redact:
    - NAPCAT_ACCESS_TOKEN
    - QQ_BRIDGE_INTERNAL_TOKEN
    - OPENCODE_SERVER_PASSWORD
  # pretty: true

features:
  images: false # Image input/output lands in M4
  files: false
  worktrees: false
  forms: false
  metrics: false

qq:
  max_message_chars: 1800
  strip_markdown: true
  reply_to_message: true
  mention_sender_in_group: true

storage:
  database_path: var/opencode-qq.db
  inbox_dir: var/inbox
