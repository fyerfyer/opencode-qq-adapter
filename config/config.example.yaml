version: 2

server:
  host: 127.0.0.1
  port: 8787
  health_path: /health
  # Used by the OpenCode qq_send_image plugin callback. Leave empty to disable.
  internal_token: ${QQ_BRIDGE_INTERNAL_TOKEN:-}

onebot:
  # NapCat's forward WebSocket server. The bridge connects out to NapCat.
  # For docker-compose.yml this is ws://127.0.0.1:3001.
  url: ${NAPCAT_WS_URL:-ws://127.0.0.1:3001}
  access_token: ${NAPCAT_ACCESS_TOKEN:-}
  # Optional; learned from events / get_login_info when omitted.
  # self_id: 123456789
  action_timeout_ms: 15000
  upload_timeout_ms: 600000
  # Probe get_login_info; if it fails while WS is connected, alert the owner.
  login_probe_ms: 60000
  dedupe_ttl_ms: 600000
  reconnect:
    enabled: true
    attempts: 1000000
    delay_ms: 3000

opencode:
  service:
    # external: discover/attach to `opencode serve --service`
    # ensure:   start it when missing (not a supervisor)
    # off:      only use base_url
    mode: external
    base_url: null
    version: ">=2.0.0 <3.0.0"
    command: ["opencode", "serve", "--service"]
    manage_lifecycle: false
  default_agent: null
  default_model: null
  prompt_timeout_ms: 1800000
  permission_timeout_ms: 120000
  event_reconnect_ms: 2000
  event_reconnect_max_ms: 30000
  health_cache_ms: 5000

security:
  allowed_roots:
    - ..
  require_mention_in_group: true
  # Extra shell rules for writable projects. Shell commands ask for approval by
  # default; these rules can allow safe read-only commands or deny dangerous ones.
  shell_rules:
    - pattern: "git status *"
      effect: allow
    - pattern: "git diff *"
      effect: allow
    - pattern: "git log *"
      effect: allow
    - pattern: "sudo *"
      effect: deny
    - pattern: "rm -rf *"
      effect: deny
  max_prompt_chars: 8000
  max_images_per_message: 4
  max_image_bytes: 10485760
  max_outbound_image_bytes: 20971520
  max_outbound_file_bytes: 52428800
  max_queued_prompts: 3
  # Normally image URLs must be public. Enable only for a local test CDN.
  allow_private_image_urls: false
  rate_limit:
    prompts_per_minute: 6
    runs_per_hour: 30
  budgets:
    daily_cost_usd_per_user: 5
    daily_tokens_per_user: 2000000
    daily_cost_usd_per_project: 20
  # Optional owner 2FA for bridge-side dangerous commands (!ws clean, ...).
  # `!sudo <code>` opens a short private-chat-only elevation window.
  admin_2fa:
    enabled: false
    totp_secret: ${QQ_ADMIN_TOTP_SECRET:-}
    window_seconds: 300
    period_seconds: 30
    digits: 6

# The project selected when a user has several available projects.
default_project: demo

users:
  "10001":
    role: owner
    projects: ["*"]
    # Owner may modify every visible project. For a read-only owner, remove "*".
    write_projects: ["*"]
  # Optional per-user limits can only tighten the global security limits.
  # "10002":
  #   role: member
  #   projects: ["demo"]
  #   # Omit or use [] to allow Q&A only; writes are denied directly.
  #   write_projects: ["demo"]
  #   limits:
  #     prompts_per_minute: 3
  #     runs_per_hour: 10
  #     daily_cost_usd: 1.5
  #     daily_tokens: 500000

# Group chats need no configuration. Every user listed above may use the bot in
# private chats and any group; each member gets an independent conversation.

projects:
  demo:
    # Relative paths are resolved against this config file's directory.
    path: ..
    description: OpenCode QQ Adapter demo project
    workspace: shared
    agent: null
    model: null
    setup: []
  # blog:
  #   path: /home/me/code/blog
  #   description: Personal blog
  #   workspace: shared
  # Internal projects (created by plugins) set hidden: true and are excluded
  # from !projects, default-project pickers and the member project list.
  # roleplay:
  #   path: ~/.local/share/opencode-qq/plugins/roleplay/personas
  #   workspace: none
  #   agent: qq-rp
  #   hidden: true
  #   managed_by: roleplay

# QQ plugin SDK (experimental). Plugins are trusted code loaded only from this
# file, never from QQ or the WebUI. Paths are relative to this config file.
# Each key must match the plugin manifest id.
plugins: {}
# hello:
#   path: ../examples/hello-plugin
#   options:
#     greeting: "你好"
# notes:
#   path: ../examples/notes-plugin
#   options:
#     maxNotes: 50
# Roleplay is generated by `opencode-qq setup --with-roleplay`. For a manual
# install, see config/roleplay.example.yaml. The WebUI page is /admin/plugins/roleplay.
# roleplay:
#   path: /absolute/path/to/packages/roleplay
#   options:
#     project_id: roleplay
#     agent: qq-rp
#     personas_dir: ~/.local/share/opencode-qq/plugins/roleplay/personas
#     fallback_project: demo
#     sticker_judge: tag
#     memory_enabled: true

workspaces:
  default_mode: shared
  root: var/workspaces
  idle_ttl_hours: 72
  max_per_project: 5
  # A run renews its lease while it is active. Leases are released on startup,
  # so a bridge restart never leaves a shared workspace permanently locked.
  lock_lease_ms: 120000
  renew_interval_ms: 30000
  cleanup:
    require_clean: true
    keep_dirty_days: 7

notifications:
  owner_alerts:
    enabled: true
    on_startup: false
    on_run_failure: true
    on_budget_exceeded: true

admin:
  # Local management UI at http://127.0.0.1:8787/admin
  # The first start generates a one-time password and prints it to the log.
  # Use `opencode-qq admin reset-password` if you miss it.
  enabled: true
  allow_remote: false
  trust_proxy: false
  session_hours: 12
  login_attempts: 5

logging:
  level: info
  audit_retention_days: 90
  store_prompt_content: false
  redact:
    - NAPCAT_ACCESS_TOKEN
    - QQ_BRIDGE_INTERNAL_TOKEN
    - OPENCODE_SERVER_PASSWORD
  # pretty: true

features:
  images: true # inbound QQ images + qq_send_image plugin
  files: true
  worktrees: false
  forms: false
  metrics: false

qq:
  max_message_chars: 1800
  # Maximum images a plugin may add to one final reply.
  max_reply_images: 2
  strip_markdown: true
  reply_to_message: true
  mention_sender_in_group: true
  # Send a short transient "working" message for slow runs, then delete it.
  progress_ack: false
  progress_delay_ms: 3000
  progress_interval_ms: 30000

storage:
  database_path: var/opencode-qq.db
  inbox_dir: var/inbox
  plugins_dir: var/plugins
  inbox_ttl_hours: 24
