# Roleplay configuration snippet.
#
# This is a fragment, not a complete bridge config. `opencode-qq-roleplay setup`
# generates these sections automatically. For manual installs, merge them into
# config.yaml, or keep a separate file and copy the blocks.
#
# Create the persona root before starting the bridge so config validation sees
# it:
#   mkdir -p ~/.local/share/opencode-qq/plugins/roleplay/personas
#
# WebUI: after the bridge starts, open /admin → Roleplay to import cards,
# upload stickers, edit Markdown memory and change these options.

version: 2

# If your config sets security.allowed_roots, include the persona root's parent:
security:
  allowed_roots:
    - ~/.local/share/opencode-qq

projects:
  roleplay:
    path: ~/.local/share/opencode-qq/plugins/roleplay/personas
    description: Roleplay personas (internal)
    workspace: none
    # Every QQ/roleplay run uses the single core Agent. Its frontmatter model
    # is the only model selection; keep model: null here.
    agent: qq-code
    model: null
    hidden: true
    managed_by: roleplay

# Group chats need no configuration. Roleplay works per user in private chats
# and in any group without a group-level allowlist.

plugins:
  roleplay:
    # Use an absolute path, or install @opencode-qq/roleplay and use its package
    # name instead of path.
    path: /absolute/path/to/opencode-qq-adapter/packages/roleplay
    options:
      project_id: roleplay
      # The plugin injects roleplay instructions, persona context, worldbook,
      # memory and reply formatting. It never installs or selects an Agent or
      # model. Configure the single qq-code Agent and its frontmatter model on
      # the core Agents page (Agents -> qq-code).
      # default_persona: blue-fat-fish
      # Project to restore on !rp off when there was no previous project.
      # fallback_project: demo
      # Must match projects.roleplay.path. If this points elsewhere, the core
      # rejects the profile directory (it escapes the project root) and the bot
      # runs at the project root without the persona's AGENTS.md.
      personas_dir: ~/.local/share/opencode-qq/plugins/roleplay/personas
      max_segments: 4
      max_chars_per_segment: 180
      delay_per_char_ms: 28
      max_delay_ms: 2500
      worldbook_scan_depth: 6
      worldbook_max_entries: 4
      worldbook_max_chars: 1200
      # Extra recursion passes: 0 disables, 1 lets selected entry content
      # activate another entry once. Shared budget still applies.
      worldbook_recursion_steps: 1
      # Per-entry match_whole_words is read from the card. This only sets the
      # fallback for entries without the field (Chinese still uses substring).
      worldbook_match_whole_words: false

      # Stickers live in <storage.plugins_dir>/roleplay/stickers/<persona>/<emotion>/
      # or _global/<emotion>/. Max one sticker per reply.
      sticker_enabled: true
      sticker_delay_ms: 600
      sticker_cooldown_ms: 10000
      # tag | jev | hybrid | off. `jev` sends the current user message and
      # character reply to a Jev decision endpoint, then thresholds on
      # confidence + sticker_ok. `hybrid` tries a model tag first.
      sticker_judge: jev
      # TypeSafe direct:
      jev_base_url: https://api.typesafe.ai/v1
      jev_endpoint: systemone
      jev_model: jev-latest
      # OpenRouter/relay example:
      # jev_base_url: https://openrouter.ai/api
      # jev_endpoint: alpha/decisions
      # jev_model: typesafe/jev-1.14
      # Secret is read from the environment, never from YAML.
      jev_api_key_env: TYPESAFE_API_KEY
      jev_min_confidence: 0.45
      jev_min_sticker_ok: 0.6
      jev_timeout_ms: 2800

      # Long-term memory lives in Markdown documents under
      # <storage.plugins_dir>/roleplay/memory/<persona>/<scope>/.
      # Raw messages stay in SQLite for FTS and evidence. Set memory_enabled:
      # false to disable background consolidation (manual !remember and raw
      # FTS still work).
      memory_enabled: true
      # Background consolidation uses the core Agent configured by
      # opencode.default_agent (fallback qq-code) in a tool-free, ephemeral
      # session. Its frontmatter model applies; plugin options cannot set one.
      memory_utility_timeout_ms: 90000
      # Consolidate after N user turns, or after the chat has been idle for
      # memory_idle_debounce_ms. No keyword heuristics are used.
      memory_consolidate_every_turns: 8
      memory_idle_debounce_ms: 120000
      memory_user_max_chars: 1200
      memory_scene_max_chars: 800
      memory_raw_top_k: 6
      memory_raw_max_chars: 600
      memory_max_chars: 2400
      memory_exclude_recent: 10
      memory_history_limit: 20
      memory_refresh_cooldown_ms: 60000
